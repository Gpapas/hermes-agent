---
- name: Configure a restricted host restart hook for Hermes
  hosts: all
  become: true

  vars:
    # Adjust these to match the host layout.
    hermes_stack_dir: /opt/data/hermes-agent
    hermes_restart_script: /usr/local/bin/restart-hermes-stack
    hermes_sudoers_file: /etc/sudoers.d/restart-hermes-stack
    hermes_restart_user: hermes

    # Optional: install a periodic cron that checks for updates and
    # restarts the stack only when a new commit is pulled.
    # The cron runs as the restart user and uses sudo only for the
    # restricted restart hook.
    hermes_enable_self_update_cron: false
    hermes_self_update_minute: "0"
    hermes_self_update_hour: "*/6"
    hermes_self_update_day: "*"
    hermes_self_update_month: "*"
    hermes_self_update_weekday: "*"

    # Optional: install a host-side Hermes CLI wrapper so you can run
    # `hermes` commands directly on the host terminal.
    #
    # If true, this playbook installs a wrapper at `hermes_host_cli_path`.
    # Set `hermes_install_default_cli_symlink` to true only if you want
    # `/usr/local/bin/hermes` itself to point at the wrapper.
    hermes_install_host_cli_wrapper: true
    hermes_install_default_cli_symlink: false
    hermes_host_cli_path: /usr/local/bin/hermes-host
    hermes_default_cli_path: /usr/local/bin/hermes

    # Host CLI mode:
    # - auto: use local venv when present, otherwise docker exec
    # - local: require a host-side Hermes venv under hermes_stack_dir
    # - docker: always docker exec into hermes_docker_container
    hermes_host_cli_mode: auto
    hermes_docker_container: hermes-agent
    hermes_docker_user: hermes
    hermes_container_cli_path: /opt/hermes/.venv/bin/hermes

    # Optional extras:
    # - Add systemd services to restart if your host runs Hermes components as units.
    # - Keep this list empty if Docker Compose is the only supervisor.
    hermes_systemd_services: []

    # Compose is the default restart path when a compose file is present.
    hermes_compose_files:
      - docker-compose.yml
      - docker-compose.yaml
      - compose.yml
      - compose.yaml

  tasks:
    - name: Ensure restart user exists (for sudoers ownership/reference)
      ansible.builtin.user:
        name: "{{ hermes_restart_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      when: hermes_restart_user != "root"

    - name: Install the restricted Hermes restart script
      ansible.builtin.copy:
        dest: "{{ hermes_restart_script }}"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          STACK_DIR="{{ hermes_stack_dir }}"
          STACK_USER="{{ hermes_restart_user }}"
          SERVICE_LIST=({% for svc in hermes_systemd_services %}{{ svc | quote }} {% endfor %})
          COMPOSE_FILES=(
            {% for file in hermes_compose_files %}
            {{ file | quote }}
            {% endfor %}
          )

          log() {
            printf '[restart-hermes-stack] %s\n' "$*"
          }

          repo_exec() {
            if [ "$(id -un)" = "$STACK_USER" ] || [ "$STACK_USER" = "root" ]; then
              "$@"
            else
              runuser -u "$STACK_USER" -- "$@"
            fi
          }

          detect_update_remote() {
            local branch remote
            branch="$(repo_exec git -C "$STACK_DIR" branch --show-current 2>/dev/null || true)"
            if [ -n "$branch" ]; then
              remote="$(repo_exec git -C "$STACK_DIR" config --get "branch.${branch}.remote" 2>/dev/null || true)"
              if [ -n "$remote" ] && repo_exec git -C "$STACK_DIR" remote get-url "$remote" >/dev/null 2>&1; then
                printf '%s\n' "$remote"
                return 0
              fi
            fi
            if repo_exec git -C "$STACK_DIR" remote get-url upstream >/dev/null 2>&1; then
              printf '%s\n' upstream
            elif repo_exec git -C "$STACK_DIR" remote get-url origin >/dev/null 2>&1; then
              printf '%s\n' origin
            else
              return 1
            fi
          }

          detect_update_branch() {
            local remote="$1" branch upstream_ref
            branch="$(repo_exec git -C "$STACK_DIR" branch --show-current 2>/dev/null || true)"
            if [ -n "$branch" ]; then
              upstream_ref="$(repo_exec git -C "$STACK_DIR" rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || true)"
              if [ -n "$upstream_ref" ]; then
                printf '%s\n' "${upstream_ref#${remote}/}"
              else
                printf '%s\n' "$branch"
              fi
              return 0
            fi
            return 1
          }

          run_git_update() {
            if [ ! -d "$STACK_DIR/.git" ]; then
              log "Skipping git update (no .git directory at $STACK_DIR)"
              return 1
            fi

            local remote branch head upstream ahead_behind
            remote="$(detect_update_remote)" || {
              log "Skipping git update (no origin/upstream remote configured)"
              return 1
            }
            branch="$(detect_update_branch "$remote")" || {
              log "Skipping git update (detached HEAD or no upstream branch configured)"
              return 1
            }

            log "Checking for updates in $STACK_DIR from ${remote}/${branch}"
            repo_exec git -C "$STACK_DIR" fetch --quiet "$remote" "$branch"

            head="$(repo_exec git -C "$STACK_DIR" rev-parse HEAD)"
            upstream="$(repo_exec git -C "$STACK_DIR" rev-parse "${remote}/${branch}")"

            if [ "$head" = "$upstream" ]; then
              log "Already up to date"
              return 1
            fi

            if [ -n "$(repo_exec git -C "$STACK_DIR" status --porcelain)" ]; then
              log "Working tree is dirty; skipping automatic pull to avoid clobbering local changes"
              return 1
            fi

            ahead_behind="$(repo_exec git -C "$STACK_DIR" rev-list --left-right --count "HEAD...${remote}/${branch}" 2>/dev/null || true)"
            log "Pulling updates (${ahead_behind:-unknown divergence})"
            repo_exec git -C "$STACK_DIR" pull --ff-only "$remote" "$branch"
            return 0
          }

          run_compose_restart() {
            local compose_cmd=()
            if ! command -v docker >/dev/null 2>&1; then
              return 1
            fi

            if docker compose version >/dev/null 2>&1; then
              compose_cmd=(docker compose)
            elif command -v docker-compose >/dev/null 2>&1; then
              compose_cmd=(docker-compose)
            else
              return 1
            fi

            local compose_file=""
            for f in "${COMPOSE_FILES[@]}"; do
              if [ -f "$STACK_DIR/$f" ]; then
                compose_file="$f"
                break
              fi
            done

            if [ -z "$compose_file" ]; then
              return 1
            fi

            log "Restarting Docker Compose stack using $compose_file"
            repo_exec "${compose_cmd[@]}" -f "$STACK_DIR/$compose_file" up -d --build --force-recreate --remove-orphans
          }

          run_systemd_restart() {
            if [ "${#SERVICE_LIST[@]}" -eq 0 ]; then
              return 1
            fi

            log "Restarting systemd services: ${SERVICE_LIST[*]}"
            systemctl restart "${SERVICE_LIST[@]}"
          }

          if run_git_update; then
            if run_compose_restart; then
              log "Docker Compose update + restart complete"
            elif run_systemd_restart; then
              log "systemd update + restart complete"
            else
              log "Update completed, but no compose file or systemd services were available to restart"
              exit 1
            fi
          else
            log "No update detected; leaving services untouched"
          fi

    - name: Install a host-side Hermes CLI wrapper
      ansible.builtin.copy:
        dest: "{{ hermes_host_cli_path }}"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          STACK_DIR="{{ hermes_stack_dir }}"
          MODE="{{ hermes_host_cli_mode }}"
          CONTAINER="{{ hermes_docker_container }}"
          CONTAINER_USER="{{ hermes_docker_user }}"
          CONTAINER_CLI="{{ hermes_container_cli_path }}"

          run_local() {
            if [ -x "$STACK_DIR/.venv/bin/hermes" ]; then
              exec "$STACK_DIR/.venv/bin/hermes" "$@"
            elif [ -x "$STACK_DIR/venv/bin/hermes" ]; then
              exec "$STACK_DIR/venv/bin/hermes" "$@"
            elif [ -x "$STACK_DIR/.venv/bin/python" ]; then
              exec "$STACK_DIR/.venv/bin/python" -m hermes_cli.main "$@"
            elif [ -x "$STACK_DIR/venv/bin/python" ]; then
              exec "$STACK_DIR/venv/bin/python" -m hermes_cli.main "$@"
            fi
            return 1
          }

          run_docker() {
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is not available; cannot exec Hermes inside container $CONTAINER" >&2
              return 1
            fi
            if ! docker inspect "$CONTAINER" >/dev/null 2>&1; then
              echo "Docker container not found: $CONTAINER" >&2
              return 1
            fi

            # Allocate a TTY only for interactive host terminal use; keep non-interactive
            # commands pipe-friendly for scripts, Ansible, and cron.
            if [ -t 0 ] && [ -t 1 ]; then
              exec docker exec -it --user "$CONTAINER_USER" "$CONTAINER" "$CONTAINER_CLI" "$@"
            else
              exec docker exec -i --user "$CONTAINER_USER" "$CONTAINER" "$CONTAINER_CLI" "$@"
            fi
          }

          case "$MODE" in
            local)
              run_local "$@" || {
                echo "Hermes CLI not found under $STACK_DIR/.venv or $STACK_DIR/venv" >&2
                exit 1
              }
              ;;
            docker)
              run_docker "$@"
              ;;
            auto)
              run_local "$@" || run_docker "$@" || {
                echo "Hermes CLI not found locally and Docker fallback failed" >&2
                exit 1
              }
              ;;
            *)
              echo "Invalid hermes_host_cli_mode: $MODE (expected auto, local, or docker)" >&2
              exit 1
              ;;
          esac
      when: hermes_install_host_cli_wrapper | bool

    - name: Optionally point the default hermes command at the host wrapper
      ansible.builtin.file:
        src: "{{ hermes_host_cli_path }}"
        dest: "{{ hermes_default_cli_path }}"
        state: link
        force: true
      when:
        - hermes_install_host_cli_wrapper | bool
        - hermes_install_default_cli_symlink | bool

    - name: Allow the restart user to run only the restart hook without a password
      ansible.builtin.copy:
        dest: "{{ hermes_sudoers_file }}"
        mode: '0440'
        owner: root
        group: root
        content: |
          {{ hermes_restart_user }} ALL=(root) NOPASSWD: {{ hermes_restart_script }}
        validate: 'visudo -cf %s'

    - name: Restrict sudoers file permissions
      ansible.builtin.file:
        path: "{{ hermes_sudoers_file }}"
        owner: root
        group: root
        mode: '0440'

    - name: Install a periodic self-update cron for Hermes
      ansible.builtin.cron:
        name: "Hermes self-update and restart"
        cron_file: hermes-self-update
        user: "{{ hermes_restart_user }}"
        minute: "{{ hermes_self_update_minute }}"
        hour: "{{ hermes_self_update_hour }}"
        day: "{{ hermes_self_update_day }}"
        month: "{{ hermes_self_update_month }}"
        weekday: "{{ hermes_self_update_weekday }}"
        job: "{{ '/usr/bin/sudo -n ' ~ hermes_restart_script if hermes_restart_user != 'root' else hermes_restart_script }}"
      when: hermes_enable_self_update_cron | bool

    - name: Show what was installed
      ansible.builtin.debug:
        msg:
          - "Installed restart script: {{ hermes_restart_script }}"
          - "Installed sudoers rule: {{ hermes_sudoers_file }}"
          - "Restart user: {{ hermes_restart_user }}"
          - "Stack directory: {{ hermes_stack_dir }}"
          - "Self-update cron: {{ 'enabled' if hermes_enable_self_update_cron | bool else 'disabled' }}"
